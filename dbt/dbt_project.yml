name: citibike
version: "1.0.0"
config-version: 2
profile: citibike

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The analysis window. The pipeline passes these from --start/--end.
  analysis_start: "2025-10-01"
  analysis_end: "2026-09-30"
  # Trips longer than this are treated as lost or unreturned bikes, not rides.
  max_trip_minutes: 1440
  rainy_day_mm: 1.0

models:
  citibike:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics

seeds:
  citibike:
    +schema: reference
